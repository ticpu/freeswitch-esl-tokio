[package]
name = "freeswitch-c-oracle"
version = "0.0.0"
edition = "2021"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
description = "FreeSWITCH's C compiled from each tracked source tree, for differential tests"
license = "MIT OR Apache-2.0"
rust-version = "1.86"
publish = false

[dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1.4"
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"
