name: CI

on:
  push:
    branches: [master, v1]
  pull_request:
    branches: [master, v1]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # target/ is deliberately not cached: compressing it costs more than the
      # rebuild it saves.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check and lint
        run: scripts/ci-check.sh

      - name: Check EslEventType vs C ESL
        run: hooks/check-event-types.sh

      - name: Test
        run: scripts/ci-test.sh

      - name: Build
        run: scripts/ci-build.sh

      # Last: it re-resolves Cargo.lock for the declared rust-version, and the
      # steps above should run against the newest dependencies.
      - name: Check declared MSRV
        run: scripts/check-msrv.sh
